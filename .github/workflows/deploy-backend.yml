name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./... && go test ./...
        working-directory: backend

  # The server runs on Coolify (https://bitchord.pymp.net). Coolify can rebuild from the repository by
  # itself; this step only asks it to do so after the tests pass, and is skipped until its two secrets exist:
  #   COOLIFY_DEPLOY_WEBHOOK  the application's Webhooks > Deploy Webhook URL
  #   COOLIFY_TOKEN           a token from Keys & Tokens > API tokens, with the deploy permission
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
      TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://bitchord.pymp.net/healthz' }}
    steps:
      - name: Ask Coolify to deploy
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::notice::COOLIFY_DEPLOY_WEBHOOK or COOLIFY_TOKEN is not set; nothing deployed from here."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
      - name: Health check
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then exit 0; fi
          for i in $(seq 1 24); do
            curl -fsS "$HEALTH_URL" && exit 0
            sleep 10
          done
          exit 1
